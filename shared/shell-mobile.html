<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prototype Mobilic : {{TITRE}}</title>
<style id="dsfr-css">{{DSFR_CSS}}</style>
<style id="app-css">{{APP_CSS}}</style>
<style>
  /* Cadre du prototype (hors application) : voir outil/outil.css */
  html, body { height: 100%; background-color: var(--background-contrast-grey); }
  /* Aperçu PDF */
  .pdf-overlay { display: none; position: fixed; inset: 0; z-index: 4000; overflow: auto; padding: 1.5rem; background-color: rgba(22,22,22,.8); }
  .pdf-overlay.open { display: block; }
  .pdf-bar { display: flex; justify-content: space-between; align-items: center; max-width: 842px; margin: 0 auto 1rem; color: #fff; }
  .pdf-bar .fr-btn { background-color: var(--background-default-grey); }
  .pdf-page { width: 595px; min-height: 842px; margin: 0 auto 1.5rem; padding: 1rem 1rem 1.5rem; background-color: #fff; color: #161616; }
  .pdf-page, .pdf-page p, .pdf-page span, .pdf-page td, .pdf-page th { font-size: 10px; line-height: 1.4; }
  .pdf-page--landscape { width: 842px; min-height: 595px; }
  .pdf-head { display: flex; gap: 1rem; align-items: center; padding-bottom: .75rem; margin-bottom: .75rem; border-bottom: 1px solid var(--border-default-grey); }
  .pdf-head .fr-logo { font-size: .55rem; }
  .pdf-head strong { display: block; font-size: 13px; }
  .pdf-block { padding: .5rem .75rem; margin-bottom: .5rem; background-color: var(--background-alt-grey); }
  .pdf-block h3 { margin: 0 0 .25rem; font-size: 10px; line-height: 1.4; font-weight: 700; text-transform: uppercase; }
  .pdf-block h3.pdf-plain { text-transform: none; }
  .pdf-row { display: flex; }
  .pdf-row span:first-child { width: 50%; }
  .pdf-cols { display: flex; gap: .5rem; }
  .pdf-cols .pdf-block { flex: 1; }
  .pdf-inline { display: flex; }
  .pdf-inline h3 { width: 50%; margin: 0; }
  .pdf-obs { min-height: 7.5rem; }
  .pdf-table { width: 100%; border-collapse: collapse; }
  .pdf-table th, .pdf-table td { padding: .375rem .5rem; border: 1px solid var(--border-default-grey); text-align: left; vertical-align: top; }
  .pdf-table th { background-color: var(--background-alt-grey); }
  .pdf-foot { margin: 1rem 0 0; color: var(--text-mention-grey); }
  @media print { .outil, .pdf-bar { display: none !important; } .pdf-overlay { position: static; padding: 0; background: none; } }
</style>
<style id="outil-css">{{OUTIL_CSS}}</style>
</head>
<body>
<div class="outil" id="outil">
  <main class="outil__scene">
    <div class="outil__vue" id="vue">
      <div class="outil-cadre">
        <p class="outil-cadre__libelle fr-text--xs fr-mb-1w" id="format-libelle"></p>
        <div class="device-box" id="device-box">
          <div class="device" id="device"><iframe id="app" title="Application Mobilic : {{TITRE}}"></iframe></div>
          <div class="outil-poignee outil-poignee--largeur" id="poignee-largeur" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Largeur du cadre" aria-valuemin="280" aria-valuemax="2560"></div>
        </div>
      </div>
      <div class="outil-calque" id="calque" aria-hidden="true"></div>
    </div>
  </main>

  <aside class="outil-inspecteur" id="inspecteur" aria-labelledby="insp-titre" hidden>
  <div class="outil-inspecteur__piste"><div class="outil-inspecteur__carte">
    <div class="outil-inspecteur__tete fr-pl-2w fr-pr-1w fr-py-1w">
      <h2 class="fr-text--sm fr-text--bold fr-mb-0 outil-inspecteur__titre" id="insp-titre">Inspecteur</h2>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-arrow-up-s-line outil-inspecteur__agrandir" id="insp-agrandir" aria-pressed="false">Agrandir l'inspecteur</button>
      <button type="button" class="fr-btn--close fr-btn fr-mb-0" id="insp-fermer" title="Fermer l'inspecteur">Fermer</button>
    </div>
    <div class="outil-inspecteur__vide fr-p-2w" id="insp-vide">
      <span class="outil-inspecteur__pictogramme fr-icon-cursor-line fr-mb-2w" aria-hidden="true"></span>
      <p class="fr-text--sm fr-mb-0 outil-mention">Cliquez sur un élément du prototype<br>pour l'inspecter.</p>
    </div>
    <div class="outil-inspecteur__contenu" id="insp-contenu" hidden>
      <div class="outil-element fr-px-2w fr-pt-2w fr-pb-1w" id="insp-element"></div>
      <div class="outil-onglets-zone">
      <ul class="fr-tabs__list outil-onglets" role="tablist" aria-label="Inspecteur">
        <li role="presentation"><button type="button" class="fr-tabs__tab fr-text--sm fr-text--regular" role="tab" id="onglet-proprietes" aria-controls="panneau-proprietes" aria-selected="true">Propriétés</button></li>
        <li role="presentation"><button type="button" class="fr-tabs__tab fr-text--sm fr-text--regular" role="tab" id="onglet-code" aria-controls="panneau-code" aria-selected="false" tabindex="-1">Code</button></li>
        <li role="presentation"><button type="button" class="fr-tabs__tab fr-text--sm fr-text--regular" role="tab" id="onglet-tokens" aria-controls="panneau-tokens" aria-selected="false" tabindex="-1">Tokens</button></li>
        <li role="presentation"><button type="button" class="fr-tabs__tab fr-text--sm fr-text--regular" role="tab" id="onglet-assets" aria-controls="panneau-assets" aria-selected="false" tabindex="-1">Assets</button></li>
      </ul>
      <span class="outil-onglets__indicateur" id="onglets-indicateur" aria-hidden="true"></span>
      </div>
      <div class="outil-inspecteur__corps">
        <div class="outil-panneau fr-px-2w fr-pt-1w fr-pb-2w" id="panneau-proprietes" role="tabpanel" aria-labelledby="onglet-proprietes" tabindex="0"></div>
        <div class="outil-panneau fr-px-2w fr-pt-1w fr-pb-2w" id="panneau-code" role="tabpanel" aria-labelledby="onglet-code" tabindex="0" hidden></div>
        <div class="outil-panneau fr-px-2w fr-pt-1w fr-pb-2w" id="panneau-tokens" role="tabpanel" aria-labelledby="onglet-tokens" tabindex="0" hidden></div>
        <div class="outil-panneau fr-px-2w fr-pt-1w fr-pb-2w" id="panneau-assets" role="tabpanel" aria-labelledby="onglet-assets" tabindex="0" hidden></div>
      </div>
    </div>
  </div></div>
  </aside>

  <div class="outil__pied" id="pied">
    <div class="outil-barre fr-mb-1w" id="barre" role="toolbar" aria-label="Outil de prototypage">
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-play-line outil-barre__icone" id="parcours-bouton" aria-haspopup="dialog" aria-expanded="false" aria-controls="parcours-liste" aria-describedby="tt-parcours">Parcours</button>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-smartphone-line outil-barre__icone" id="format-bouton" aria-describedby="tt-format">Passer au format Desktop</button>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-magic-line outil-barre__icone" id="remplir" aria-describedby="tt-remplir">Remplir le formulaire</button>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-restart-line outil-barre__icone" id="recommencer" aria-describedby="tt-recommencer">Recommencer le prototype</button>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-cursor-line outil-barre__icone outil-inspecter" id="inspecter" aria-pressed="false" aria-describedby="tt-inspecter">Inspecteur</button>
      <button type="button" class="fr-btn fr-btn--tertiary-no-outline fr-btn--sm fr-icon-eye-off-line outil-barre__icone" id="masquer" aria-describedby="tt-masquer">Masquer la barre</button>
    </div>
  </div>

  <div class="outil-liste" id="parcours-liste" role="dialog" aria-label="Choisir un parcours" hidden>
    <div class="fr-input-group fr-mb-0">
      <label class="fr-label fr-sr-only" for="parcours-recherche">Rechercher un parcours</label>
      <input class="fr-input" id="parcours-recherche" type="text" role="combobox" aria-expanded="true" aria-controls="parcours-options" aria-autocomplete="list" autocomplete="off" placeholder="Rechercher un parcours">
    </div>
    <div class="fr-mt-1w" id="parcours-options" role="listbox" aria-label="Parcours"></div>
    <p class="fr-text--sm fr-mt-2w fr-mb-1w outil-liste__vide" id="parcours-vide" role="status" hidden></p>
  </div>
</div>

<span class="fr-tooltip fr-placement" id="tt-parcours" role="tooltip" aria-hidden="true">Parcours</span>
<span class="fr-tooltip fr-placement" id="tt-format" role="tooltip" aria-hidden="true">Format d'écran</span>
<span class="fr-tooltip fr-placement" id="tt-remplir" role="tooltip" aria-hidden="true">Remplir le formulaire</span>
<span class="fr-tooltip fr-placement" id="tt-recommencer" role="tooltip" aria-hidden="true">Recommencer<span class="outil-raccourci fr-ml-1w">R</span></span>
<span class="fr-tooltip fr-placement" id="tt-inspecter" role="tooltip" aria-hidden="true">Inspecteur<span class="outil-raccourci fr-ml-1w">I</span></span>
<span class="fr-tooltip fr-placement" id="tt-masquer" role="tooltip" aria-hidden="true">Masquer la barre<span class="outil-raccourci fr-ml-1w">@</span></span>
<p class="fr-sr-only" id="outil-annonce" role="status" aria-live="polite"></p>

<div class="pdf-overlay" id="pdf" role="dialog" aria-modal="true" aria-label="Aperçu du bulletin de contrôle PDF">
  <div class="pdf-bar">
    <strong>Aperçu du PDF téléchargé</strong>
    <ul class="fr-btns-group fr-btns-group--inline fr-btns-group--sm">
      <li><button type="button" class="fr-btn fr-btn--secondary fr-icon-printer-line fr-btn--icon-left" onclick="window.print()">Imprimer</button></li>
      <li><button type="button" class="fr-btn fr-btn--secondary fr-icon-close-line fr-btn--icon-left" onclick="pdf.classList.remove('open')">Fermer</button></li>
    </ul>
  </div>
  <div id="pdf-pages"></div>
</div>

<template id="app-tpl">{{APP_HTML}}<script>{{APP_JS}}</script></template>

<script>
  const frame = document.getElementById('app');
  const dsfrCss = document.getElementById('dsfr-css').textContent, appCss = document.getElementById('app-css').textContent;
  frame.srcdoc = '<!DOCTYPE html><html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style id="dsfr">'
    + dsfrCss + '</style><style id="mobilic">' + appCss + '</style></head><body>' + document.getElementById('app-tpl').innerHTML + '</body></html>';
  function cmd(name) { frame.contentWindow.postMessage({ type: 'cmd', name }, '*'); }
  const pdf = document.getElementById('pdf');
  window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'pdf') { document.getElementById('pdf-pages').innerHTML = m.html; pdf.classList.add('open'); }
  });
</script>
<script type="application/json" id="outil-data">{{OUTIL_DATA}}</script>
<script>{{OUTIL_JS}}</script>
</body>
</html>
