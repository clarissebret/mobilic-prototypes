<svg width="70px" height="72px" viewBox="6 5 70 72" xmlns="http://www.w3.org/2000/svg">
  <!-- Pictogramme Mobilic « Webinaire », dans le style des pictogrammes DSFR (même construction que picto-gestionnaire.svg) :
       trait de 2, écart visible de 3 entre deux traits, rouge jamais superposé au bleu, points décoratifs -->
  <style>
    .decorative { fill: #ECECFF; }
    .minor { fill: none; stroke: #E1000F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .major { fill: none; stroke: #000091; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .major-fill { fill: #000091; }
  </style>
  <!-- Points décoratifs -->
  <circle class="decorative" cx="12" cy="15" r="1"/>
  <circle class="decorative" cx="72" cy="9" r="1"/>
  <circle class="decorative" cx="57" cy="74" r="1"/>
  <!-- Bulle du fond, interrompue derrière la bulle du premier plan, avec sa queue en bas à gauche -->
  <path class="major" d="M25.55 42.22L18 46l2.04-7.64A13 13 0 1 1 42.84 27.97"/>
  <path class="minor" d="M22 24h11M22 28h9M22 32h5"/>
  <!-- Bulle du premier plan, queue en bas à droite : guillemets et lignes de texte -->
  <path class="major" d="M53 60.86A16 16 0 1 1 58.86 55L63 65z"/>
  <path class="minor" d="M38 40v3M41.5 40v3M37 48h16M37 52h13"/>
  <!-- Petite bulle « en train d'écrire » -->
  <path class="major" d="M53 10h14v11h-9l-3 3v-3h-2z"/>
  <circle class="major-fill" cx="57" cy="15.5" r="1"/>
  <circle class="major-fill" cx="60" cy="15.5" r="1"/>
  <circle class="major-fill" cx="63" cy="15.5" r="1"/>
  <!-- Tiret et pointillés -->
  <path class="major" d="M10 56h5"/>
  <circle class="major-fill" cx="18.5" cy="56" r="1"/>
  <circle class="major-fill" cx="22" cy="56" r="1"/>
</svg>
