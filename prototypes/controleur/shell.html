<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prototype Mobilic : interface contrôleur</title>
<style id="dsfr-css">{{DSFR_CSS}}</style>
<style id="app-css">{{APP_CSS}}</style>
<style>
  /* Cadre du prototype (hors application) */
  html, body { min-height: 100%; background-color: var(--background-contrast-grey); }
  .proto { display: flex; gap: 1.5rem; justify-content: center; align-items: flex-start; padding: 1.5rem; }
  .side { width: 17rem; position: sticky; top: 1.5rem; }
  .side h2 { margin-bottom: 1rem; }
  .side .flows { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  .side .flows li { margin-bottom: .5rem; }
  .side .flows .fr-btn { width: 100%; }
  .side .fill { margin-bottom: 1.5rem; }
  .side .fill[hidden] { display: none; }

  /* Téléphone Android */
  .device { padding: 12px; border-radius: 44px; background: #1e1e1e; box-shadow: 0 0 0 2px #3a3a3a, 0 12px 32px rgba(0,0,0,.35); position: relative; }
  .device::before { content: ""; position: absolute; right: -4px; top: 140px; width: 4px; height: 64px; border-radius: 0 3px 3px 0; background: #2b2b2b; }
  .device::after { content: ""; position: absolute; right: -4px; top: 230px; width: 4px; height: 100px; border-radius: 0 3px 3px 0; background: #2b2b2b; }
  .screen-wrap { width: 360px; border-radius: 32px; overflow: hidden; background-color: var(--background-default-grey); }
  .android-status { position: relative; height: 32px; display: flex; justify-content: space-between; align-items: center; padding: 0 1.25rem 0 1.5rem;
    background-color: var(--background-default-grey); color: #161616; font-family: Roboto, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; }
  .android-status__camera { position: absolute; left: 50%; top: 8px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #1e1e1e; }
  .android-status__icons { display: flex; gap: 4px; align-items: center; }
  .android-status__icons [class*="fr-icon-"]::before { --icon-size: 15px; }
  .android-nav { height: 48px; display: flex; justify-content: space-around; align-items: center; background-color: #f2f2f2; }
  .android-nav button { width: 64px; height: 40px; border: 0; border-radius: 20px; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #3c3c3c; }
  .android-nav button:hover { background-color: rgba(0,0,0,.06); }
  .android-nav button[disabled] { cursor: default; background: none; }
  .android-nav svg { width: 18px; height: 18px; }
  #app { display: block; width: 360px; height: 720px; border: 0; }

  /* Aperçu PDF */
  .pdf-overlay { display: none; position: fixed; inset: 0; z-index: 4000; overflow: auto; padding: 1.5rem; background-color: rgba(22,22,22,.8); }
  .pdf-overlay.open { display: block; }
  .pdf-bar { display: flex; justify-content: space-between; align-items: center; max-width: 842px; margin: 0 auto 1rem; color: #fff; }
  .pdf-bar .fr-btn { background-color: var(--background-default-grey); }
  .pdf-page { width: 595px; min-height: 842px; margin: 0 auto 1.5rem; padding: 1rem 1rem 1.5rem; background-color: #fff; color: #161616; }
  .pdf-page, .pdf-page p, .pdf-page span, .pdf-page td, .pdf-page th { font-size: 10px; line-height: 1.4; }
  .pdf-page--landscape { width: 842px; min-height: 595px; }
  .pdf-head { display: flex; gap: 1rem; align-items: center; padding-bottom: .75rem; margin-bottom: .75rem; border-bottom: 1px solid var(--border-default-grey); }
  .pdf-head .fr-logo { font-size: .55rem; }
  .pdf-head strong { display: block; font-size: 13px; }
  .pdf-block { padding: .5rem .75rem; margin-bottom: .5rem; background-color: var(--background-alt-grey); }
  .pdf-block h3 { margin: 0 0 .25rem; font-size: 10px; line-height: 1.4; font-weight: 700; text-transform: uppercase; }
  .pdf-block h3.pdf-plain { text-transform: none; }
  .pdf-row { display: flex; }
  .pdf-row span:first-child { width: 50%; }
  .pdf-cols { display: flex; gap: .5rem; }
  .pdf-cols .pdf-block { flex: 1; }
  .pdf-inline { display: flex; }
  .pdf-inline h3 { width: 50%; margin: 0; }
  .pdf-obs { min-height: 7.5rem; }
  .pdf-table { width: 100%; border-collapse: collapse; }
  .pdf-table th, .pdf-table td { padding: .375rem .5rem; border: 1px solid var(--border-default-grey); text-align: left; vertical-align: top; }
  .pdf-table th { background-color: var(--background-alt-grey); }
  .pdf-foot { margin: 1rem 0 0; color: var(--text-mention-grey); }
  @media print { .proto, .pdf-bar { display: none !important; } .pdf-overlay { position: static; padding: 0; background: none; } }
</style>
</head>
<body>
<div class="proto">
  <aside class="side" aria-label="Commandes du prototype">
    <h2 class="fr-h6">Flux à tester</h2>
    <ul class="flows">
      <li><button type="button" class="fr-btn fr-btn--secondary" onclick="cmd('flow-lic')">Contrôle LIC papier / feuille de route</button></li>
    </ul>
    <div class="fill" id="fill" hidden>
      <div class="fr-select-group fr-mb-1w" id="fill-act-group">
        <label class="fr-label" for="demo-act">Secteur des données de test</label>
        <select class="fr-select" id="demo-act">
          <option>TRM - Courte distance</option>
          <option>TRS - Transport sanitaire</option>
        </select>
      </div>
      <button type="button" class="fr-btn fr-btn--sm fr-icon-edit-line fr-btn--icon-left" onclick="cmd('fill')">Remplir le formulaire</button>
    </div>
    <button type="button" class="fr-btn fr-btn--tertiary fr-btn--sm fr-icon-refresh-line fr-btn--icon-left" onclick="cmd('reset')">Réinitialiser</button>
    <p class="fr-hint-text fr-mt-2w">Données fictives. SIREN de test : 110014016.</p>
  </aside>

  <div class="device">
    <div class="screen-wrap">
      <div class="android-status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="android-status__camera"></span>
        <span class="android-status__icons"><span class="fr-icon-signal-wifi-fill"></span><span class="fr-icon-signal-cellular-3-fill"></span><span class="fr-icon-battery-fill"></span></span>
      </div>
      <iframe id="app" title="Application Mobilic contrôleur (vue mobile)"></iframe>
      <nav class="android-nav" aria-label="Barre de navigation Android">
        <button type="button" title="Retour" onclick="back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M17 4.5v15L5 12z"/></svg></button>
        <button type="button" title="Accueil (inactif)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg></button>
        <button type="button" title="Applications récentes (inactif)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      </nav>
    </div>
  </div>
</div>

<div class="pdf-overlay" id="pdf" role="dialog" aria-modal="true" aria-label="Aperçu du bulletin de contrôle PDF">
  <div class="pdf-bar">
    <strong>Aperçu du PDF téléchargé</strong>
    <ul class="fr-btns-group fr-btns-group--inline fr-btns-group--sm">
      <li><button type="button" class="fr-btn fr-btn--secondary fr-icon-printer-line fr-btn--icon-left" onclick="window.print()">Imprimer</button></li>
      <li><button type="button" class="fr-btn fr-btn--secondary fr-icon-close-line fr-btn--icon-left" onclick="pdf.classList.remove('open')">Fermer</button></li>
    </ul>
  </div>
  <div id="pdf-pages"></div>
</div>

<template id="app-tpl">{{APP_HTML}}<script>{{APP_JS}}</script></template>

<script>
  const frame = document.getElementById('app');
  const css = document.getElementById('dsfr-css').textContent + document.getElementById('app-css').textContent;
  frame.srcdoc = '<!DOCTYPE html><html lang="fr" data-fr-scheme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>'
    + css + '</style></head><body>' + document.getElementById('app-tpl').innerHTML + '</body></html>';
  function cmd(name) { frame.contentWindow.postMessage({ type: 'cmd', name, act: document.getElementById('demo-act').value }, '*'); }
  const pdf = document.getElementById('pdf');
  function back() {
    if (pdf.classList.contains('open')) return pdf.classList.remove('open');
    cmd('back');
  }
  window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'pdf') { document.getElementById('pdf-pages').innerHTML = m.html; pdf.classList.add('open'); }
    if (m.type === 'screen') {
      document.getElementById('fill').hidden = !m.form;
      document.getElementById('fill-act-group').hidden = m.name !== 'form';
    }
  });
  const tick = () => { const d = new Date(); document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 30000);
</script>
</body>
</html>
